<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <title>How AI Interviewer works</title>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .bg { fill: #f5f5f7; }
    .card { fill: #ffffff; stroke: rgba(0,0,0,0.08); stroke-width: 1; }
    .hero { fill: #1d1d1f; }
    .h1 { fill: #1d1d1f; font-size: 40px; font-weight: 700; letter-spacing: -0.8px; }
    .sub { fill: #6e6e73; font-size: 20px; letter-spacing: -0.2px; }
    .eyebrow { fill: #86868b; font-size: 12px; font-weight: 600; letter-spacing: 1.4px; }
    .name { fill: #1d1d1f; font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }
    .desc { fill: #6e6e73; font-size: 15px; }
    .hname { fill: #ffffff; font-size: 24px; font-weight: 600; letter-spacing: -0.3px; }
    .hmeta { fill: #a1a1a6; font-size: 14px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .hstep { fill: #f5f5f7; font-size: 16px; }
    .hnum { fill: #86868b; font-size: 13px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .rule { stroke: rgba(255,255,255,0.12); stroke-width: 1; }
    .line { fill: none; stroke: #86868b; stroke-width: 1.5; }
    .voice { fill: none; stroke: #0071e3; stroke-width: 2.5; }
    .lbl { fill: #6e6e73; font-size: 13.5px; }
    .vlbl { fill: #0071e3; font-size: 14px; font-weight: 600; }
    .chev { fill: none; stroke: #86868b; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .vchev { fill: none; stroke: #0071e3; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .foot { fill: #86868b; font-size: 14px; }
    .dot { fill: #0071e3; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #000000; }
      .card { fill: #1c1c1e; stroke: rgba(255,255,255,0.09); }
      .hero { fill: #2c2c2e; }
      .h1, .name { fill: #f5f5f7; }
      .sub, .desc, .lbl { fill: #a1a1a6; }
      .line { stroke: #636366; }
      .chev { stroke: #636366; }
      .voice, .vchev { stroke: #0a84ff; }
      .vlbl, .dot { fill: #0a84ff; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path class="chev" d="M3,1.5 L10,6 L3,10.5"/>
    </marker>
    <marker id="v" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path class="vchev" d="M3,1.5 L10,6 L3,10.5"/>
    </marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect class="bg" width="1600" height="960"/>

  <!-- Heading -->
  <text class="h1" x="80" y="100">How AI Interviewer works</text>
  <text class="sub" x="80" y="138">Two people, one server, four services. The voice call never touches our server.</text>

  <!-- Column labels -->
  <text class="eyebrow" x="80" y="226">PEOPLE</text>
  <text class="eyebrow" x="630" y="226">OUR SERVER</text>
  <text class="eyebrow" x="1180" y="226">SERVICES WE USE</text>

  <!-- ===== Connections (drawn first, under the cards) ===== -->
  <!-- Recruiter -> server -->
  <path class="line" d="M420,335 H626" marker-end="url(#a)"/>
  <text class="lbl" x="525" y="322" text-anchor="middle">jobs, links, results</text>

  <!-- Candidate -> server -->
  <path class="line" d="M420,690 H748 Q760,690 760,678 V614" marker-end="url(#a)"/>
  <text class="lbl" x="580" y="677" text-anchor="middle">resume + recording</text>

  <!-- Server -> services -->
  <path class="line" d="M974,310 H1176" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="lbl" x="1075" y="297" text-anchor="middle">saves everything</text>

  <path class="line" d="M970,430 H1176" marker-end="url(#a)"/>
  <text class="lbl" x="1075" y="417" text-anchor="middle">reads their projects</text>

  <path class="line" d="M970,550 H1176" marker-end="url(#a)"/>
  <text class="lbl" x="1075" y="537" text-anchor="middle">scores the answers</text>

  <!-- Server -> OpenAI (start call, collect transcript) -->
  <path class="line" d="M920,614 V733 Q920,745 932,745 H1176" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="lbl" x="1060" y="732" text-anchor="middle">starts call, gets transcript</text>

  <!-- Candidate <-> OpenAI: live voice -->
  <path class="voice" d="M424,790 H1174" marker-start="url(#v)" marker-end="url(#v)"/>
  <rect class="bg" x="562" y="776" width="200" height="28"/>
  <circle class="dot" cx="578" cy="790" r="5"/>
  <text class="vlbl" x="592" y="795">Live voice conversation</text>

  <!-- ===== People ===== -->
  <g filter="url(#s)">
    <rect class="card" x="80" y="260" width="340" height="150" rx="18"/>
    <rect class="card" x="80" y="660" width="340" height="150" rx="18"/>
  </g>
  <text class="name" x="112" y="318">Recruiter</text>
  <text class="desc" x="112" y="348">Creates a job and a scoring checklist,</text>
  <text class="desc" x="112" y="372">sends links, reads the results.</text>

  <text class="name" x="112" y="718">Candidate</text>
  <text class="desc" x="112" y="748">Opens their link, uploads a resume,</text>
  <text class="desc" x="112" y="772">talks to the AI. No account needed.</text>

  <!-- ===== Server ===== -->
  <g filter="url(#s)">
    <rect class="hero" x="630" y="250" width="340" height="360" rx="22"/>
  </g>
  <text class="hname" x="662" y="306">AI Interviewer</text>
  <text class="hmeta" x="662" y="332">Python · FastAPI</text>
  <line class="rule" x1="662" y1="358" x2="938" y2="358"/>
  <text class="hnum" x="662" y="398">01</text><text class="hstep" x="698" y="398">Checks the invite link</text>
  <text class="hnum" x="662" y="442">02</text><text class="hstep" x="698" y="442">Reads the resume and GitHub</text>
  <text class="hnum" x="662" y="486">03</text><text class="hstep" x="698" y="486">Saves every spoken line</text>
  <text class="hnum" x="662" y="530">04</text><text class="hstep" x="698" y="530">Scores against the checklist</text>
  <text class="hnum" x="662" y="574">05</text><text class="hstep" x="698" y="574">Shows results to your team only</text>

  <!-- ===== Services ===== -->
  <g filter="url(#s)">
    <rect class="card" x="1180" y="260" width="340" height="100" rx="18"/>
    <rect class="card" x="1180" y="380" width="340" height="100" rx="18"/>
    <rect class="card" x="1180" y="500" width="340" height="100" rx="18"/>
    <rect class="card" x="1180" y="700" width="340" height="120" rx="18"/>
  </g>
  <text class="name" x="1212" y="303">Supabase</text>
  <text class="desc" x="1212" y="330">Database, private files, logins</text>

  <text class="name" x="1212" y="423">GitHub</text>
  <text class="desc" x="1212" y="450">Public projects linked in the resume</text>

  <text class="name" x="1212" y="543">Gemini</text>
  <text class="desc" x="1212" y="570">Grades each checklist item, 0–10</text>

  <text class="name" x="1212" y="748">OpenAI Realtime</text>
  <text class="desc" x="1212" y="775">The interviewer’s voice. Asks</text>
  <text class="desc" x="1212" y="798">questions about the candidate’s work.</text>

  <!-- Footnote -->
  <text class="foot" x="80" y="892">Resumes and recordings are stored privately and opened through links that expire in 10 minutes. Each company sees only its own candidates.</text>
</svg>
